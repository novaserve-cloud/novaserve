<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <style>
    .text-nova { fill: #64748b; font-weight: 500; }
    .text-serve { fill: #4338ca; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .text-nova { fill: #94a3b8; font-weight: 500; }
      .text-serve { fill: #818cf8; font-weight: 700; }
    }
  </style>

  <!-- Abstract N Node Graph Icon -->
  <g transform="translate(8, 8) scale(0.48)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 76 L 24 24 L 76 76 L 76 24" stroke="#6366f1" stroke-width="8"/>
    <circle cx="24" cy="76" r="7" fill="#6366f1" />
    <circle cx="24" cy="24" r="7" fill="#6366f1" />
    <circle cx="76" cy="76" r="7" fill="#6366f1" />
    <circle cx="76" cy="24" r="8" fill="#38bdf8" />
  </g>

  <!-- Minimal Typography: Nova (Subtle) + SERVE (Stronger) -->
  <text x="64" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="30" letter-spacing="-0.5">
    <tspan class="text-nova">Nova</tspan><tspan class="text-serve">Serve</tspan>
  </text>
</svg>
