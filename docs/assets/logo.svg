<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="novaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Core Icon Gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="20" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Glow Effect -->
  <circle cx="140" cy="120" r="90" fill="url(#novaGlow)" />

  <!-- Diamond / Nova Emblem -->
  <g transform="translate(140, 120)" filter="url(#shadow)">
    <!-- Outer Rotated Diamond -->
    <path d="M 0 -55 L 45 0 L 0 55 L -45 0 Z" fill="url(#iconGradient)" />
    <!-- Inner Star Cutout -->
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="#0b0f19" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="8" fill="url(#accentGradient)" />
  </g>

  <!-- Typography -->
  <text x="240" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5" fill="url(#textGradient)">
    Nova<tspan fill="url(#accentGradient)">Serve</tspan>
  </text>

  <!-- Tagline -->
  <text x="242" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" letter-spacing="1.5" fill="#94a3b8">
    NEXT-GEN SERVERLESS FRAMEWORK
  </text>
</svg>
