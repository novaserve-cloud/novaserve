<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Node & Flow Gradients -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#818cf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Abstract Interconnected Infrastructure "N" Node Graph -->
  <g filter="url(#subtleGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Infrastructure Flow Paths -->
    <!-- Left Vertical Up -->
    <line x1="50" y1="150" x2="50" y2="50" stroke="url(#nodeGradient)" stroke-width="12" />
    <!-- Diagonal Compiler Transition -->
    <line x1="50" y1="50" x2="150" y2="150" stroke="url(#nodeGradient)" stroke-width="12" />
    <!-- Right Vertical Up -->
    <line x1="150" y1="150" x2="150" y2="50" stroke="url(#nodeGradient)" stroke-width="12" />

    <!-- Infrastructure Nodes (SDK → Compiler → IR → Cloud) -->
    <!-- Node 1: Left Bottom (Input / SDK) -->
    <circle cx="50" cy="150" r="14" fill="#0f172a" stroke="url(#nodeGradient)" stroke-width="6" />
    <circle cx="50" cy="150" r="5" fill="#38bdf8" />

    <!-- Node 2: Left Top (Compiler Engine) -->
    <circle cx="50" cy="50" r="14" fill="#0f172a" stroke="url(#nodeGradient)" stroke-width="6" />
    <circle cx="50" cy="50" r="5" fill="#818cf8" />

    <!-- Node 3: Right Bottom (Nova IR) -->
    <circle cx="150" cy="150" r="14" fill="#0f172a" stroke="url(#nodeGradient)" stroke-width="6" />
    <circle cx="150" cy="150" r="5" fill="#c084fc" />

    <!-- Node 4: Right Top (Cloud Provider Target - Glowing Accent) -->
    <circle cx="150" cy="50" r="16" fill="#0f172a" stroke="url(#glowGradient)" stroke-width="6" />
    <circle cx="150" cy="50" r="6" fill="#facc15" />
  </g>
</svg>
