name: Release to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for NPM Provenance

jobs:
  publish:
    name: Publish with Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Run automated package validation
        run: node scripts/validate-package.mjs

      - name: Dry-run package creation
        run: cd packages/cli && npm pack --dry-run

      - name: Publish CLI to NPM with Provenance
        run: |
          cd packages/cli
          pnpm publish --provenance --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "Verifying published version: $CLI_VERSION"
          npm view novaserve@$CLI_VERSION version
          npx novaserve@$CLI_VERSION --version || true

