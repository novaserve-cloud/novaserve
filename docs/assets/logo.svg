<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Node & Flow Line Gradients -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cloudAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="textPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>

    <style>
      .wordmark-nova { fill: #0f172a; }
      .wordmark-serve { fill: url(#textPrimary); }
      .bg-node { fill: #ffffff; }

      @media (prefers-color-scheme: dark) {
        .wordmark-nova { fill: #f8fafc; }
        .bg-node { fill: #0f172a; }
      }
    </style>
  </defs>

  <!-- Abstract Interconnected "N" Infrastructure Flow Icon -->
  <g transform="translate(20, 20)" filter="url(#nodeShadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flow Lines -->
    <line x1="30" y1="90" x2="30" y2="30" stroke="url(#flowGrad)" stroke-width="8" />
    <line x1="30" y1="30" x2="90" y2="90" stroke="url(#flowGrad)" stroke-width="8" />
    <line x1="90" y1="90" x2="90" y2="30" stroke="url(#flowGrad)" stroke-width="8" />

    <!-- Nodes (SDK → Compiler → IR → Cloud Target) -->
    <circle cx="30" cy="90" r="10" class="bg-node" stroke="url(#flowGrad)" stroke-width="4" />
    <circle cx="30" cy="90" r="4" fill="#38bdf8" />

    <circle cx="30" cy="30" r="10" class="bg-node" stroke="url(#flowGrad)" stroke-width="4" />
    <circle cx="30" cy="30" r="4" fill="#6366f1" />

    <circle cx="90" cy="90" r="10" class="bg-node" stroke="url(#flowGrad)" stroke-width="4" />
    <circle cx="90" cy="90" r="4" fill="#a855f7" />

    <circle cx="90" cy="30" r="11" class="bg-node" stroke="url(#cloudAccent)" stroke-width="4" />
    <circle cx="90" cy="30" r="4" fill="#f59e0b" />
  </g>

  <!-- Typography Wordmark -->
  <text x="145" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" letter-spacing="-1.5">
    <tspan class="wordmark-nova">Nova</tspan><tspan class="wordmark-serve">Serve</tspan>
  </text>
</svg>
