<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="100%" height="100%">
  <style>
    .text-nova { fill: #dc2626; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.6px; }
    .text-serve { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.6px; }
    .badge-bg { fill: #f1f5f9; stroke: #e2e8f0; }
    .badge-text { fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 500; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .text-serve { fill: #ffffff; }
      .badge-bg { fill: #1e293b; stroke: #334155; }
      .badge-text { fill: #94a3b8; }
    }
  </style>

  <!-- Yellow Diamond ◆ -->
  <polygon points="26,14 44,32 26,50 8,32" fill="#ffb800" />

  <!-- Nova (Dark Red) + Serve Typography -->
  <text x="58" y="42">
    <tspan class="text-nova">Nova</tspan><tspan class="text-serve">Serve</tspan>
  </text>

  <!-- Version Badge v2.1.4 -->
  <rect x="232" y="16" width="76" height="32" rx="8" class="badge-bg" stroke-width="1.5" />
  <text x="270" y="37" text-anchor="middle" class="badge-text">v2.1.4</text>
</svg>
