<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Minimalist Flat Infrastructure Node Graph "N" -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Infrastructure Lines -->
    <path d="M 24 76 L 24 24 L 76 76 L 76 24" stroke="#6366f1" stroke-width="8"/>

    <!-- Nodes (SDK → Compiler → IR → Provider) -->
    <!-- Node 1: SDK (Bottom-Left) -->
    <circle cx="24" cy="76" r="7" fill="#6366f1" stroke="none" />
    <!-- Node 2: Compiler (Top-Left) -->
    <circle cx="24" cy="24" r="7" fill="#6366f1" stroke="none" />
    <!-- Node 3: IR (Bottom-Right) -->
    <circle cx="76" cy="76" r="7" fill="#6366f1" stroke="none" />
    <!-- Node 4: Cloud Target (Top-Right - Accent Node) -->
    <circle cx="76" cy="24" r="8" fill="#38bdf8" stroke="none" />
  </g>
</svg>
